# Free web service using the existing Neon database. No paid database is created.
services:
  - type: web
    name: revup
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: STUB_POS
        value: false
